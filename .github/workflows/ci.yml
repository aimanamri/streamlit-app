name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - name: Offline tests (parsers and indicators)
        run: pytest -q
      - name: Apps start without errors
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for f in ["currencyconverterapp.py", "stockprice.py"]:
              at = AppTest.from_file(f, default_timeout=120).run()
              assert not at.exception, (f, [e.value for e in at.exception])
          PY
