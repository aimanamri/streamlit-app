name: Update market data

# SC Malaysia publishes the Shariah list on the last Friday of May and November, and JPX / Nasdaq
# lists change all the time. This runs on the 1st and 15th of every month; it only commits when
# something actually changed, and the commit makes Streamlit Community Cloud redeploy the app.
on:
  schedule:
    - cron: "0 2 1,15 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Which parser to run (empty = all)"
        type: choice
        default: ""
        options: ["", shariah, tickers]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pip install -r requirements-data.txt
      - name: Run parsers
        id: parse
        run: python scripts/update_data.py ${{ inputs.task }}
        continue-on-error: true   # a failing source keeps its old file; still commit the others
      - name: Offline tests
        run: pytest -q
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Data unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "data-updater[bot]"
          git config user.email "data-updater@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh Shariah list and ticker lists"
          git push
      - name: Fail the run if a parser failed
        if: steps.parse.outcome == 'failure'
        run: |
          echo "A parser failed; see the 'Run parsers' step. Previous data was kept."
          exit 1
